# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/AgentManifest.yaml
name: foundry-memo
displayName: "Foundry Memo"

description: >
  Retrieves SharePoint content via the Copilot Retrieval API and generates summarized PDF memos.
  Self-improving — learns from each run to get better at fetching, merging, summarizing, and generating PDFs.

template:
  name: foundry-memo
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  resources:
    cpu: "1"
    memory: 2Gi
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: COSMOS_ENDPOINT
      value: "{{COSMOS_ENDPOINT}}"

parameters:
  properties: []

resources:
  - kind: model
    id: gpt-5
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
  - kind: toolbox
    name: copilot-search
    tools:
      - type: mcp
        server_label: copilot-search
        project_connection_id: copilot-search-oauth
        require_approval: never
