name: foundry-memo
description: Retrieves SharePoint content via the Copilot Retrieval API and generates summarized PDF memos.
model:
  name: gpt-5
  sku: GlobalStandard
environment:
  - name: FOUNDRY_PROJECT_ENDPOINT
  - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
    value: gpt-5
container:
  resources:
    cpu: "1"
    memory: 2Gi
protocols:
  - name: responses
    version: v0.1.0
