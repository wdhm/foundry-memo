# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: foundry-memo
description: |
    Retrieves SharePoint content via the Copilot Retrieval API and generates summarized PDF memos. Self-improving — learns from each run to get better at fetching, merging, summarizing, and generating PDFs.
protocols:
    - protocol: responses
      version: 1.0.0
resources:
    cpu: "1"
    memory: 2Gi
environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: gpt-5
