# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-memo
metadata:
    template: foundry-memo
services:
    foundry-memo:
        project: src/FoundryMemo
        host: azure.ai.agent
        language: docker
        docker:
            remoteBuild: true
        config:
            container:
                resources:
                    cpu: "1"
                    memory: 2Gi
            deployments:
                - model:
                    format: OpenAI
                    name: gpt-5
                    version: "2025-08-07"
                  name: gpt-5
                  sku:
                    capacity: 40
                    name: GlobalStandard
            startupCommand: dotnet run
infra:
    provider: bicep
    path: infra
